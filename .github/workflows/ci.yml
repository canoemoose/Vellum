# Type check, tests, and a release build without bundling, on demand: Actions > CI > Run
# workflow, or `gh workflow run ci.yml --ref <branch>`. It does not run on pushes; the Release
# workflow runs the same checks before it builds anything. See docs/release-pipeline-scope.md.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Type check
        run: npm run check

      # The Rust crate embeds the front end and the notices file, so both exist before cargo runs.
      - name: Build the front end and the notices
        run: |
          node tools/make-notices.mjs
          npm run build

      # Includes the print round trip, which runs through cargo.
      - name: Front-end tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Release build (no installer)
        run: npm run tauri build -- --no-bundle
