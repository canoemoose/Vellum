[package]
name = "vellum"
version = "0.1.0"
description = "Vellum PDF viewer (phase 0 rendering spike)"
authors = ["Event Engineering"]
edition = "2024"

[lib]
# rlib only: the cdylib/staticlib outputs are for mobile targets and the cdylib
# hits the MinGW export-ordinal limit on the GNU toolchain.
name = "vellum_lib"
crate-type = ["rlib"]
# Unit tests live in tests/ (see build.rs for why: Windows manifest for test binaries).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest"] }
# WP-Images: decode image documents, then crop and resample regions in Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
fast_image_resize = "5"
# WP-LOD: scaled-IDCT JPEG decode (1/8) for image level of detail.
jpeg-decoder = { version = "0.3", default-features = false }
# WP-Shell: a second launch hands its file to the running window (Explorer "Open with").
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
