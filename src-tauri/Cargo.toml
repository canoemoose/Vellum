[package]
name = "vellum"
version = "0.1.1"
description = "A fast PDF and image viewer for CAD drawings"
authors = ["Matt James"]
license = "MIT"
repository = "https://github.com/canoemoose/Vellum"
edition = "2024"

[lib]
# rlib only: the cdylib/staticlib outputs are for mobile targets and the cdylib
# hits the MinGW export-ordinal limit on the GNU toolchain.
name = "vellum_lib"
crate-type = ["rlib"]
# Unit tests live in tests/ (see build.rs for why: Windows manifest for test binaries).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest"] }
# WP-Images: decode image documents, then crop and resample regions in Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
fast_image_resize = "5"
# WP-LOD: scaled-IDCT JPEG decode (1/8) for image level of detail.
jpeg-decoder = { version = "0.3", default-features = false }
# Huge JPEGs with an ICC profile: converted to sRGB once instead of by PDFium on every render.
# Already in the build through `image`; pure Rust.
moxcms = { version = "0.8", features = ["options"] }
# WP-Shell: a second launch hands its file to the running window (Explorer "Open with").
tauri-plugin-single-instance = "2"
# Editing: appends markups to PDFs as annotations (incremental update). Chosen and proven in
# phase 0 (docs/editing-scope.md). Pinned to the minor version: the writer relies on its
# incremental-save and re-encryption behaviour; re-run tests/annot.rs on any upgrade.
lopdf = { version = "~0.47", default-features = false }
# In-app updates from GitHub Releases (docs/release-pipeline-scope.md).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  # snap.rs: the native overlay over the maximise button (Windows 11 snap layouts).
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # text.rs links: ShellExecuteW hands a web address to the default browser.
  "Win32_UI_Shell",
  # annot/commands.rs: the account's display name for markups' author (GetUserNameExW).
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
] }

# WP-Print: printer enumeration, capabilities and GDI output (StartDoc / StretchDIBits), and
# pdfium-render's win32 bindings for FPDF_RenderPage (the Vector print path).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Storage_Xps",
]

[target.'cfg(windows)'.dependencies.pdfium-render]
version = "0.9"
default-features = false
features = ["pdfium_latest", "pdfium_use_win32"]
# End WP-Print

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
