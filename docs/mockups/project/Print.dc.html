<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#3b6fd9}a:hover{color:#2a54aa}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.t-dark{--chrome:#141517;--app:#1b1c1f;--ctl:#232428;--bd:#2a2c31;--bd-ctl:#2f3136;--bd-strong:#34363c;--bd-input:#3a3d44;--tx:#e6e7ea;--tx2:#c9cbd1;--tx3:#9a9da5;--canvas:#2b2d31;--tab-on:#2a2c31;--shadow:rgba(0,0,0,0.45)}
.t-light{--chrome:#ebebe8;--app:#f6f6f4;--ctl:#ffffff;--bd:#dcdcd7;--bd-ctl:#d6d6d0;--bd-strong:#cfcfc8;--bd-input:#c4c4bd;--tx:#1d1e21;--tx2:#3d3f45;--tx3:#5f6269;--canvas:#d9d9d4;--tab-on:#e3e3de;--shadow:rgba(0,0,0,0.18)}
</style>
</helmet>
<div class="t-{{theme}}" style="width: 1080px; height: 780px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--app); color: var(--tx); font-family: Inter, system-ui, sans-serif; font-size: 13px; border: 1px solid var(--bd-strong); border-radius: 10px; overflow: hidden">

<!-- Header -->
<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; border-bottom: 1px solid var(--bd); background: var(--chrome); flex-shrink: 0">
<span style="font-size: 15px; font-weight: 600">Print — Hall 3 — Stage Plan Rev C.pdf</span>
<button aria-label="Close" style="width: 32px; height: 32px; border: none; background: transparent; color: var(--tx3); border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg></button>
</div>

<div style="flex: 1 1 auto; min-height: 0; display: flex">

<!-- Options -->
<div style="width: 430px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; border-right: 1px solid var(--bd); overflow-y: auto">

<!-- Preset -->
<div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--bd); background: var(--chrome)">
<label for="pr-preset" style="color: var(--tx2); width: 70px">Preset</label>
<select id="pr-preset" style="flex: 1 1 auto; height: 32px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px; font-weight: 600"><option>A3 site set — black lines, stamped</option></select>
<button aria-label="Save as new preset" style="width: 32px; height: 32px; border: 1px solid var(--bd-input); background: var(--ctl); color: var(--tx2); border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 2.5h7l2 2v7h-9z M4.5 2.5v3h4v-3 M4.5 11.5v-3h5v3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px">

<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr) 54px 56px; align-items: center; gap: 8px">
<label for="pr-printer" style="color: var(--tx2)">Printer</label>
<select id="pr-printer" style="height: 32px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Office laser (A3)</option></select>
<label for="pr-copies" style="color: var(--tx2); text-align: right">Copies</label>
<input id="pr-copies" value="1" style="width: 56px; height: 32px; padding: 0 8px; box-sizing: border-box; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Pages</span>
<div style="display: flex; gap: 2px; padding: 2px; background: var(--ctl); border: 1px solid var(--bd-ctl); border-radius: 8px">
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">All 12</button>
<button aria-pressed="true" style="flex: 1 1 0; height: 30px; border: none; background: {{accentSoft}}; color: {{accent}}; border-radius: 6px; font-weight: 600">Current</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Range</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">View</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Marquee</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Sizing</span>
<div style="display: flex; gap: 2px; padding: 2px; background: var(--ctl); border: 1px solid var(--bd-ctl); border-radius: 8px">
<button aria-pressed="true" style="flex: 1 1 0; height: 30px; border: none; background: {{accentSoft}}; color: {{accent}}; border-radius: 6px; font-weight: 600">Fit</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Actual</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">To scale</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Tile</button>
<a href="PrintManual.dc.html" style="flex: 1 1 0; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--tx2); border-radius: 6px; text-decoration: none">Manual</a>
</div>
<div style="display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 8px">
<label for="pr-fitto" style="color: var(--tx2)">Fit to</label>
<select id="pr-fitto" style="height: 32px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Printable area (driver: 4.2 mm margins)</option></select>
</div>
<div style="display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: var(--ctl); border: 1px solid var(--bd-ctl); border-radius: 6px; color: var(--tx2); line-height: 1.4">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 7v4M8 4.8v0.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
<span>A1 on A3 prints at <strong style="color: var(--tx)">1:206</strong>. Choose “To scale” for exactly 1:200.</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-weight: 600">Colour</span>
<div style="display: flex; gap: 2px; padding: 2px; background: var(--ctl); border: 1px solid var(--bd-ctl); border-radius: 8px">
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Colour</button>
<button aria-pressed="false" style="flex: 1 1 0; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Greyscale</button>
<button aria-pressed="true" style="flex: 1 1 0; height: 30px; border: none; background: {{accentSoft}}; color: {{accent}}; border-radius: 6px; font-weight: 600">Black lines</button>
</div>
</div>
</div>

<!-- Collapsible sections -->
<div style="display: flex; flex-direction: column; border-top: 1px solid var(--bd)">

<button aria-expanded="{{open.layout}}" onClick="{{toggleLayout}}" style="height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border: none; border-bottom: 1px solid var(--bd); background: transparent; text-align: left">
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="transform: {{rot.layout}}"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 600; width: 72px">Layout</span>
<span style="color: var(--tx3); flex: 1 1 auto">1 per sheet · printer margins · centred</span>
</button>
<sc-if value="{{open.layout}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 10px; padding: 12px 20px 14px 42px; border-bottom: 1px solid var(--bd)">
<label for="pr-nup" style="color: var(--tx2)">Pages per sheet</label>
<div style="display: flex; gap: 8px">
<select id="pr-nup" style="flex: 1 1 auto; height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>1</option></select>
<select aria-label="Page order" style="flex: 1 1 auto; height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Across, then down</option></select>
</div>
<label for="pr-margins" style="color: var(--tx2)">Margins</label>
<select id="pr-margins" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Printer minimum</option></select>
<span style="color: var(--tx2)">Placement</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px">
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Centre on sheet</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Auto-rotate each page</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Page borders</span></label>
</div>
<label for="pr-special" style="color: var(--tx2)">Special</label>
<select id="pr-special" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>None</option><option>Booklet</option><option>Tile with overlap and cut marks</option></select>
</div>
</sc-if>

<button aria-expanded="{{open.paper}}" onClick="{{togglePaper}}" style="height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border: none; border-bottom: 1px solid var(--bd); background: transparent; text-align: left">
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="transform: {{rot.paper}}"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 600; width: 72px">Paper</span>
<span style="color: var(--tx3); flex: 1 1 auto">A3 · by PDF page size · single-sided</span>
</button>
<sc-if value="{{open.paper}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 10px; padding: 12px 20px 14px 42px; border-bottom: 1px solid var(--bd)">
<label for="pr-paper" style="color: var(--tx2)">Paper size</label>
<select id="pr-paper" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>A3 (297 × 420 mm)</option></select>
<span style="color: var(--tx2)">Mixed sizes</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Choose tray by PDF page size</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Shrink oversized pages only</span></label>
</div>
<label for="pr-duplex" style="color: var(--tx2)">Two-sided</label>
<select id="pr-duplex" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Off</option><option>Flip on long edge</option><option>Flip on short edge</option></select>
<span style="color: var(--tx2)">Order</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px">
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Collate</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Reverse order</span></label>
</div>
</div>
</sc-if>

<button aria-expanded="{{open.content}}" onClick="{{toggleContent}}" style="height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border: none; border-bottom: 1px solid var(--bd); background: transparent; text-align: left">
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="transform: {{rot.content}}"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 600; width: 72px">Content</span>
<span style="color: var(--tx3); flex: 1 1 auto">Markups on · 2 of 7 layers hidden · stamped</span>
</button>
<sc-if value="{{open.content}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: start; gap: 10px; padding: 12px 20px 14px 42px; border-bottom: 1px solid var(--bd)">
<span style="color: var(--tx2); padding-top: 2px">Include</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px">
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Markups</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Comment pins</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Form fields</span></label>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>Comment summary page</span></label>
</div>
<span style="color: var(--tx2); padding-top: 2px">PDF layers</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 3px 9px; border-radius: 12px; background: {{accentSoft}}; color: var(--tx)">Walls</span>
<span style="padding: 3px 9px; border-radius: 12px; background: {{accentSoft}}; color: var(--tx)">Stage</span>
<span style="padding: 3px 9px; border-radius: 12px; background: {{accentSoft}}; color: var(--tx)">Seating</span>
<span style="padding: 3px 9px; border-radius: 12px; background: {{accentSoft}}; color: var(--tx)">AV</span>
<span style="padding: 3px 9px; border-radius: 12px; background: {{accentSoft}}; color: var(--tx)">Title block</span>
<span style="padding: 3px 9px; border-radius: 12px; border: 1px dashed var(--bd-input); color: var(--tx3); text-decoration: line-through">Grid</span>
<span style="padding: 3px 9px; border-radius: 12px; border: 1px dashed var(--bd-input); color: var(--tx3); text-decoration: line-through">Dimensions</span>
</div>
<span style="color: var(--tx2); padding-top: 2px">Margin stamp</span>
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" checked style="width: 15px; height: 15px; accent-color: {{accent}}; margin: 0"><span>File name, page, date</span></label>
</div>
</sc-if>

<button aria-expanded="{{open.advanced}}" onClick="{{toggleAdvanced}}" style="height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border: none; border-bottom: 1px solid var(--bd); background: transparent; text-align: left">
<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="transform: {{rot.advanced}}"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 600; width: 72px">Advanced</span>
<span style="color: var(--tx3); flex: 1 1 auto">Vector · hairlines ≥ 0.13 mm</span>
</button>
<sc-if value="{{open.advanced}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 10px; padding: 12px 20px 14px 42px; border-bottom: 1px solid var(--bd)">
<label for="pr-mode" style="color: var(--tx2)">Send as</label>
<select id="pr-mode" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>Vector (best)</option><option>Image, 300 dpi (driver workaround)</option><option>Image, 600 dpi</option></select>
<label for="pr-hair" style="color: var(--tx2)">Thicken hairlines</label>
<select id="pr-hair" style="height: 30px; padding: 0 8px; background: var(--ctl); border: 1px solid var(--bd-input); border-radius: 6px"><option>To 0.13 mm</option></select>
<span style="color: var(--tx2)">Driver</span>
<button style="height: 30px; padding: 0 10px; justify-self: start; border: 1px solid var(--bd-input); background: var(--ctl); color: var(--tx); border-radius: 6px">Printer properties…</button>
</div>
</sc-if>
</div>
</div>

<!-- Preview -->
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--canvas)">
<div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px">
<div style="width: 560px; height: 396px; background: #ffffff; box-shadow: 0 6px 24px var(--shadow); position: relative">
<svg viewBox="0 0 1000 707" width="100%" height="100%" role="img" aria-label="Print preview of the stage plan in black lines, grid and dimensions hidden">
<rect x="14" y="14" width="972" height="679" fill="none" stroke="#e05555" stroke-width="1.5" stroke-dasharray="5 5"></rect>
<g transform="translate(18 18) scale(0.964)" fill="none" stroke="#000">
<rect x="20" y="20" width="960" height="667" stroke-width="2"></rect>
<rect x="70" y="70" width="640" height="500" stroke-width="3.5"></rect>
<rect x="210" y="90" width="360" height="110" stroke-width="2.5"></rect>
<rect x="100" y="110" width="80" height="8" fill="#000"></rect>
<rect x="600" y="110" width="80" height="8" fill="#000"></rect>
<g stroke-width="1.2">
<rect x="160" y="270" width="200" height="22"></rect><rect x="420" y="270" width="200" height="22"></rect>
<rect x="160" y="304" width="200" height="22"></rect><rect x="420" y="304" width="200" height="22"></rect>
<rect x="160" y="338" width="200" height="22"></rect><rect x="420" y="338" width="200" height="22"></rect>
<rect x="160" y="372" width="200" height="22"></rect><rect x="420" y="372" width="200" height="22"></rect>
<rect x="160" y="406" width="200" height="22"></rect><rect x="420" y="406" width="200" height="22"></rect>
</g>
<rect x="340" y="480" width="100" height="50" stroke-width="2"></rect>
<rect x="780" y="527" width="200" height="160" stroke-width="2"></rect>
<path d="M780 567h200M780 607h200M780 647h200" stroke-width="1.2"></path>
<rect x="590" y="96" width="100" height="40" rx="10" stroke-width="2.5" stroke-dasharray="6 4"></rect>
</g>
<text x="40" y="690" font-family="Inter, sans-serif" font-size="12" fill="#000">Hall 3 — Stage Plan Rev C.pdf · p3 · 07/11/2026 19:12</text>
</svg>
</div>
</div>
<div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--tx2); border-top: 1px solid var(--bd)">
<button aria-label="Previous sheet" style="width: 30px; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 3L4.5 7l4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span>Sheet 1 of 1 · A3 landscape</span>
<button aria-label="Next sheet" style="width: 30px; height: 30px; border: none; background: transparent; color: var(--tx2); border-radius: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<span style="width: 1px; height: 16px; background: var(--bd-strong)"></span>
<span style="display: flex; align-items: center; gap: 6px; color: var(--tx3)"><span style="width: 14px; border-top: 1.5px dashed #e05555"></span>Printable area</span>
</div>
</div>
</div>

<!-- Footer -->
<div style="height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-top: 1px solid var(--bd); background: var(--chrome); flex-shrink: 0">
<button style="height: 34px; padding: 0 14px; border: 1px solid var(--bd-strong); background: var(--ctl); color: var(--tx); border-radius: 6px">Save as PDF…</button>
<button style="height: 34px; padding: 0 14px; border: none; background: transparent; color: var(--tx2); border-radius: 6px">Save preset…</button>
<div style="flex: 1 1 auto"></div>
<button style="height: 34px; padding: 0 16px; border: 1px solid var(--bd-strong); background: var(--ctl); color: var(--tx); border-radius: 6px">Cancel</button>
<button style="height: 34px; padding: 0 20px; border: none; background: {{accent}}; color: #ffffff; border-radius: 6px; font-weight: 600">Print</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#e5484d","options":["#3b82f6","#e5484d","#14b8a6","#f59e0b"]},"$preview":{"width":1080,"height":780}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: { layout: true, paper: false, content: false, advanced: false } };
}
toggle(key) {
const open = Object.assign({}, this.state.open);
open[key] = !open[key];
this.setState({ open: open });
}
renderVals() {
const accent = this.props.accent ?? '#e5484d';
const open = this.state.open;
const r = (k) => open[k] ? 'rotate(90deg)' : 'none';
return {
theme: this.props.theme ?? 'dark',
accent: accent,
