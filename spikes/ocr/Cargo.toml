[package]
name = "ocr-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: OCR search on scanned pages with Windows' built-in OCR (Windows.Media.Ocr)"

# Standalone: not part of the app build.
[workspace]

[dependencies]
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Debug output only: saving a rendered tile to look at.
png = "0.17"

[target.'cfg(windows)'.dependencies]
# The same crate and version the app already depends on (src-tauri/Cargo.toml), plus the
# WinRT namespaces OCR needs. These are the features the app would add.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
debug = false
